<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ପଶୁମାନଙ୍କ ଦୁନିଆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --ink: #1a1a1a;
  --muted: #86868b;
  --line: #e5e5ea;
  --radius-lg: 32px;
  --radius-md: 20px;
  --radius-sm: 12px;
  --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Google Sans', system-ui, sans-serif;
  line-height: 1.5;
  padding-bottom: 100px; /* Space for floating banner */
}

/* --- Sticky Header --- */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(245, 245, 247, 0.85); /* Semi-transparent to match body bg */
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  padding: 20px 24px 15px;
  max-width: 1200px;
  margin: auto;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.greeting { font-size: 1.1rem; color: var(--muted); margin: 0 0 4px 0; font-weight: 500; }
header h1 {
  font-size: clamp(2rem, 6vw, 2.8rem);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.5px;
}

main { max-width: 1200px; margin: auto; padding: 24px 24px 0; }

/* --- Search Bar --- */
.search-container {
  position: relative;
  margin-bottom: 24px;
}
.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  fill: var(--muted);
}
input[type="search"] {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--card);
  padding: 18px 20px 18px 48px;
  border-radius: 100px;
  font-family: inherit;
  font-size: 1.1rem;
  color: var(--ink);
  box-shadow: var(--shadow-soft);
  transition: border 0.3s, box-shadow 0.3s;
  outline: none;
}
input[type="search"]:focus { border: 1px solid #d2d2d7; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
input[type="search"]::placeholder { color: #a1a1a6; }

/* --- Suggestions / Category Selection --- */
.suggestions-title {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0 0 12px 0;
}
.category-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 24px;
  scrollbar-width: none;
}
.category-scroll::-webkit-scrollbar { display: none; }

.pill {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 10px 20px;
  border-radius: 100px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s ease;
}
.pill.active {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}

/* Mobile Dropdown Container (Hidden on Desktop) */
.category-dropdown-wrapper {
  display: none;
  margin-bottom: 24px;
}
.category-dropdown {
  width: 100%;
  padding: 14px 20px;
  border-radius: 100px;
  border: 1px solid var(--line);
  background: var(--card);
  font-family: inherit;
  font-size: 1.05rem;
  color: var(--ink);
  outline: none;
  box-shadow: var(--shadow-soft);
}

/* --- Grid & Cards --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
  animation: fadeUp 0.6s ease forwards;
  opacity: 0;
}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

.photo-wrapper {
  position: relative;
  aspect-ratio: 4/3;
  padding: 12px 12px 0 12px;
}
.photo {
  width: 100%;
  height: 100%;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #f0f0f5;
  position: relative;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.floating-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(5px);
  padding: 6px 12px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink);
}

.body {
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.odia-name { font-size: 1.5rem; font-weight: 700; margin: 0 0 2px 0; }
.eng-name { font-size: 0.9rem; color: var(--muted); margin: 0 0 16px 0; text-transform: capitalize; }
.sci-name { font-style: italic; opacity: 0.8; }

.desc-odia { font-size: 1rem; color: #333; margin: 0 0 8px 0; line-height: 1.5; }
.desc-eng { font-size: 0.85rem; color: var(--muted); margin: 0 0 24px 0; }

.btn-black {
  margin-top: auto;
  background: var(--ink);
  color: white;
  text-decoration: none;
  font-weight: 500;
  font-size: 1rem;
  padding: 16px;
  border-radius: 100px;
  text-align: center;
  transition: transform 0.2s, background 0.2s;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
.btn-black:active { transform: scale(0.97); }

/* --- Floating Smart Banner --- */
.promo-container {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  display: flex;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: 90%;
}

.promo-box {
  background: var(--ink);
  color: white;
  padding: 12px 12px 12px 24px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  pointer-events: auto;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  width: 100%;
}

.promo-text {
  display: flex;
  flex-direction: column;
  white-space: nowrap;
  transition: opacity 0.3s;
}
.promo-title { font-weight: 700; font-size: 0.95rem; }
.promo-desc { font-size: 0.8rem; color: #a1a1a6; margin-top: 2px;}

.promo-btn {
  background: white;
  color: var(--ink);
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 0.9rem;
  white-space: nowrap;
}

/* Shrunk State (When Scrolling) */
.promo-container.shrunk {
  left: calc(100% - 24px); /* 24px padding from right */
  transform: translateX(-100%);
  bottom: 24px;
}
.promo-container.shrunk .promo-box {
  padding: 0;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  justify-content: center;
}
.promo-container.shrunk .promo-text { display: none; }
.promo-container.shrunk .promo-btn {
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}
/* Download Icon CSS */
.promo-container.shrunk .promo-btn svg { width: 24px; height: 24px; stroke: white; fill: none; }
.promo-container:not(.shrunk) .promo-btn svg { display: none; }

.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem; }

/* Responsive Adjustments */
@media(max-width: 600px) {
  header { padding: 15px 20px 10px; }
  main { padding: 20px 20px 0; }
  
  /* Hide scroll pills, show dropdown on mobile */
  .category-scroll { display: none; }
  .category-dropdown-wrapper { display: block; }
  
  .promo-box { padding: 10px 10px 10px 20px; gap: 12px; }
  .promo-title { font-size: 0.85rem; }
}
</style>
</head>
<body>

<header>
  <div class="greeting">ସ୍ୱାଗତମ, ଆସନ୍ତୁ ଜାଣିବା</div>
  <h1>ପଶୁମାନଙ୍କ ଦୁନିଆ</h1>
</header>

<main>
  <!-- Search -->
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="search" type="search" placeholder="ପ୍ରାଣୀ ଖୋଜନ୍ତୁ..." autocomplete="off">
  </div>

  <h2 class="suggestions-title">ବିଭାଗ ବାଛନ୍ତୁ</h2>
  
  <!-- Categories for Desktop (Pills) -->
  <div class="category-scroll" id="category-container">
    <div class="pill active" data-val="">ସବୁ ପ୍ରାଣୀ</div>
    <!-- Injected via JS -->
  </div>

  <!-- Categories for Mobile (Dropdown) -->
  <div class="category-dropdown-wrapper">
    <select id="category-dropdown" class="category-dropdown">
      <option value="">ସବୁ ପ୍ରାଣୀ</option>
      <!-- Injected via JS -->
    </select>
  </div>

  <!-- Grid -->
  <div id="message" class="empty" style="display:none;"></div>
  <div id="grid" class="grid"></div>
</main>

<!-- Floating Banner with Download Icon on Shrink -->
<div class="promo-container" id="smart-banner">
  <div class="promo-box">
    <div class="promo-text">
      <span class="promo-title">🚧 This website is still a work in progress</span>
      <span class="promo-desc">କେବଳ Odia Bhasa ଆପ୍‌ରେ ଉପଲବ୍ଧ</span>
    </div>
    <a href="https://play.google.com/store/apps/details?id=in.sandeep.odiabhasa" target="_blank" class="promo-btn" aria-label="Download App">
      <span>ଡାଉନଲୋଡ୍</span>
      <!-- Download SVG -->
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let animals = [];
let activeCategory = "";

const API_URL = "https://imsbg.github.io/animals/odia-bhasa/data.json";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Floating Banner Scroll Logic
window.addEventListener("scroll", () => {
  const banner = $("smart-banner");
  if(window.scrollY > 100) {
    banner.classList.add("shrunk");
  } else {
    banner.classList.remove("shrunk");
  }
});

async function loadAnimals() {
  try {
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error("ତ୍ରୁଟି: ତଥ୍ୟ ମିଳିଲା ନାହିଁ।");
    const data = await res.json();
    animals = Array.isArray(data) ? data : Array.isArray(data.animals) ? data.animals : [];
    
    if(!animals.length) throw new Error("କୌଣସି ପ୍ରାଣୀ ମିଳିଲେ ନାହିଁ।");
    
    // Generate Categories for both Pill and Dropdown
    const categories = [...new Set(animals.map(a => a.category).filter(Boolean))].sort();
    
    const pillContainer = $("category-container");
    const dropdown = $("category-dropdown");
    
    categories.forEach(c => {
      // For Desktop Pills
      const pill = document.createElement("div");
      pill.className = "pill";
      pill.setAttribute("data-val", c);
      pill.innerText = c;
      pillContainer.appendChild(pill);
      
      // For Mobile Dropdown
      const option = document.createElement("option");
      option.value = c;
      option.innerText = c;
      dropdown.appendChild(option);
    });

    // Pill Click Event (Desktop)
    document.querySelectorAll(".pill").forEach(el => {
      el.addEventListener("click", function() {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        this.classList.add("active");
        
        activeCategory = this.getAttribute("data-val");
        $("category-dropdown").value = activeCategory; // Sync Dropdown
        render();
      });
    });

    // Dropdown Change Event (Mobile)
    dropdown.addEventListener("change", function() {
      activeCategory = this.value;
      
      // Sync Pills
      document.querySelectorAll(".pill").forEach(p => {
        if(p.getAttribute("data-val") === activeCategory) {
          p.classList.add("active");
        } else {
          p.classList.remove("active");
        }
      });
      
      render();
    });
    
    render();
  } catch(e) {
    $("message").style.display = "block";
    $("message").innerHTML = `<strong>${esc(e.message)}</strong>`;
  }
}

function render() {
  const q = $("search").value.trim().toLocaleLowerCase();
  
  const list = animals.filter(a => {
    const text = [a.name, a.scientificName, a.category, a.description, a.odiaName, a.descriptionOdia].join(" ").toLocaleLowerCase();
    return (!q || text.includes(q)) && (!activeCategory || a.category === activeCategory);
  });

  $("grid").innerHTML = list.map((a, index) => {
    const image = esc(a.image || "");
    const profile = typeof a.profileDetails === "string" && /^https?:\/\//i.test(a.profileDetails) ? a.profileDetails : "";
    const safeProfile = esc(profile);
    const animDelay = (index * 0.05).toFixed(2) + 's';

    return `
    <article class="card" style="animation-delay: ${animDelay};">
      <div class="photo-wrapper">
        <div class="photo">
          ${a.conservationStatus ? `<div class="floating-badge">${esc(a.conservationStatus)}</div>` : ""}
          ${image ? `<img src="${image}" alt="${esc(a.odiaName)}" loading="lazy">` : ''}
        </div>
      </div>
      <div class="body">
        <h2 class="odia-name">${esc(a.odiaName || "")}</h2>
        <h3 class="eng-name">${esc(a.name || "")} <span class="sci-name">(${esc(a.scientificName || "")})</span></h3>
        
        ${a.descriptionOdia ? `<p class="desc-odia">${esc(a.descriptionOdia)}</p>` : ""}
        ${a.description ? `<p class="desc-eng">${esc(a.description)}</p>` : ""}
        
        ${safeProfile ? `<a href="${safeProfile}" class="btn-black" target="_blank" rel="noopener noreferrer">
          ସମ୍ପୂର୍ଣ୍ଣ ତଥ୍ୟ ପଢନ୍ତୁ
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>` : ""}
      </div>
    </article>`;
  }).join("");

  if(!list.length) { 
    $("message").style.display = "block"; 
    $("message").textContent = "ଆପଣ ଖୋଜୁଥିବା ପ୍ରାଣୀ ମିଳିଲା ନାହିଁ।"; 
  } else { 
    $("message").style.display = "none"; 
  }
}

$("search").addEventListener("input", render);

loadAnimals();
</script>

</body>
</html>
